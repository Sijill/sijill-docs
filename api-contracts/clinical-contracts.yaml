          type: string
          example: "COMPLETE_BLOOD_COUNT"
        specimenType:
          type: string
          example: "BLOOD"
        priority:
          type: string
          example: ROUTINE
        fastingRequired:
          type: boolean
          example: false
        clinicalIndication:
          type: string
          nullable: true
          example: "Rule out anaemia"
        result:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LabResultDetail"

    ImagingOrderDetail:
      type: object
      properties:
        imagingType:
          type: string
          example: "MRI"
        bodyPart:
          type: string
          example: "CHEST"
        priority:
          type: string
          example: ROUTINE
        contrastUsed:
          type: boolean
          example: false
        clinicalIndication:
          type: string
          nullable: true
          example: "Evaluate lung hyperinflation"
        result:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ImagingResultDetail"

    LabResultDetail:
      type: object
      properties:
        resultData:
          type: object
          description: Structured result data as uploaded by the lab (free-form JSON)
          example: { "haemoglobin": "13.5 g/dL", "WBC": "7.2 x10^9/L" }
        additionalNotes:
          type: string
          nullable: true
          example: "All values within normal range"
        uploadedAt:
          type: string
          format: date-time
          example: "2026-03-12T14:00:00.000Z"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentReference"

    ImagingResultDetail:
      type: object
      properties:
        studyDescription:
          type: string
          nullable: true
          example: "Chest MRI without contrast"
        findings:
          type: string
          nullable: true
          example: "No significant abnormalities detected"
        uploadedAt:
          type: string
          format: date-time
          example: "2026-03-12T16:00:00.000Z"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentReference"

    DocumentReference:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
          example: "cbc_result_march2026.pdf"
        mimeType:
          type: string
          example: "application/pdf"
        fileSizeBytes:
          type: integer
          example: 204800
        url:
          type: string
          example: "https://files.sijill.gov/results/abc123.pdf"

    CreateEncounterResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        encounterId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        message:
          type: string
          example: "Encounter recorded successfully"
        notificationsCreated:
          type: integer
          description: How many patient notifications were automatically created
          example: 3

    Pagination:
      type: object
      properties:
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 5

    # -------------------------------------------------------
    # ERROR SCHEMAS
    # -------------------------------------------------------

    BadRequestError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: "accessType is required for HEALTHCARE_PROVIDER entity type"
        error:
          type: string
          example: "Bad Request"

    UnauthorizedError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 401
        message:
          type: string
          example: "Missing or invalid authentication token"
        error:
          type: string
          example: "Unauthorized"

    ForbiddenError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 403
        message:
          type: string
          example: "This session does not permit this action"
        error:
          type: string
          example: "Forbidden"

    NotFoundError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          type: string
          example: "Resource not found"
        error:
          type: string
          example: "Not Found"

    InternalServerError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 500
        message:
          type: string
          example: "An unexpected error occurred"
        error:
          type: string
          example: "Internal Server Error"

  # -------------------------------------------------------
  # SECURITY SCHEMES
  # -------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Standard user JWT returned from POST /auth/login/verify-otp.
        Used to authenticate as a PATIENT, HEALTHCARE_PROVIDER, LAB,
        or IMAGING_CENTER.

    ClinicalSessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived JWT scoped to a specific HCP–patient session.
        Returned from POST /clinical/sessions.
        Used for all /clinical/sessions/{sessionId}/* endpoints.

    LabSessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived JWT scoped to a specific lab session and order.
        Returned from POST /diagnostic/lab/sessions.
        Used for all /diagnostic/lab/sessions/{sessionId}/* endpoints.

    ImagingSessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived JWT scoped to a specific imaging session and order.
        Returned from POST /diagnostic/imaging/sessions.
        Used for all /diagnostic/imaging/sessions/{sessionId}/* endpoints.
